# WebKit run (v1.16, his 2a 2026-11-06): the open board bugs in docs/known-issues.md are Safari-only; this runs the board tests listed in
# tools/ci/webkit.txt on Playwright's WebKit (PW_BROWSER=webkit, tools/tests/_browser.js). A SEPARATE workflow on purpose: a WebKit
# problem never blocks the Chromium shards of regression.yml. One job, <= 15 min, about 10 GitHub minutes a run.
# A test that fails here but passes on Chromium is a candidate real Safari bug: read the job log (do NOT "fix" the test to go green).
# workflow_dispatch: tests = space-separated names (default: tools/ci/webkit.txt).
name: webkit
on:
  push:
    branches: ['claude/**', 'main']
    paths: ['src/board/**', 'src/gear/**', 'src/stands/**', 'tools/ci/webkit.txt', '.github/workflows/webkit.yml', 'tools/tests/_browser.js']
  workflow_dispatch:
    inputs:
      tests:
        description: 'space-separated test names (default: tools/ci/webkit.txt)'
        default: ''
      deps:
        description: "'no' skips playwright install-deps webkit (apt, 1–8 min). Run 42225921373: WITHOUT it WebKit cannot launch (libgst*, libflite*, libGLESv2 … missing), so the default installs"
        default: 'yes'
  schedule:
    - cron: '0 6 * * 1'   # Monday 06:00 UTC
concurrency:
  group: webkit-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-1.56.1-webkit
      - name: tools
        timeout-minutes: 12
        env:
          INPUT_DEPS: ${{ github.event.inputs.deps }}
        run: |
          npm i --no-save --prefix /tmp/ci playwright@1.56.1 typescript@5 >/dev/null 2>&1
          # same bounded 3-try pattern as regression.yml; the last tries fall back to install-deps + a plain install
          ok=0
          # Run 42222057691 (ubuntu-24.04): --with-deps hit the 240 s bound in apt and left a dpkg lock behind; the plain download alone took
          # seconds. So: plain download FIRST (cached across runs), then ONE bounded install-deps for WebKit's libraries (failure tolerated —
          # a missing library shows up as a launch error in the tests, which is the real signal).
          for i in 1 2 3; do timeout 240 npx --prefix /tmp/ci playwright install webkit >/tmp/pwi.log 2>&1 && { ok=1; break; }; echo "playwright webkit install try $i failed:"; tail -25 /tmp/pwi.log; sleep 5; done
          # apt on the runners is unpredictable (34 s one run, >420 s the next: 42224590088). Run 42223229945 launched WebKit
          # (MiniBrowser + WPEWebProcess) only AFTER install-deps; run 42225921373 without it: launch error, 40 libraries missing. So deps
          # are installed unless dispatch input deps=no; bounded 600 s, failure tolerated (the launch error names what is missing).
          if [ "$INPUT_DEPS" != "no" ]; then timeout 600 sudo -E env "PATH=$PATH" npx --prefix /tmp/ci playwright install-deps webkit >/tmp/pwd.log 2>&1 || { echo "install-deps webkit did not finish (exit $?) — continuing:"; tail -15 /tmp/pwd.log; }; fi
          [ "$ok" = 1 ] || { echo "WebKit could not be installed"; exit 1; }
      - name: build
        run: sh build.sh | tail -1
      - name: tests (WebKit)
        timeout-minutes: 26   # run 42227120761: ≈3 min a test on Linux WebKit (tv91r 175 s); 8 tests ≈ 25 min. Runs are rare (Monday cron, board/gear/stands pushes, dispatch).
        env:
          NODE_PATH: /tmp/ci/node_modules
          PW_BROWSER: webkit
          REGNOEXPAND: '1'
          REGSLOTS: '0'    # one runner: its own -j is the limit
          REGSHARE: '0'    # the shared-browser server is Chromium-only
          INPUT_TESTS: ${{ github.event.inputs.tests }}
        run: |
          set +e   # bash -e killed the loop at the first failing test with no output (run 42224590088)
          T="$INPUT_TESTS"; [ -n "$T" ] || T=$(tr '\n' ' ' < tools/ci/webkit.txt)
          echo "WebKit tests: $T"
          # One test at a time, each bounded, output shown as it finishes (run 42223229945: smartreg -j 2 hung 8.6 min with no
          # partial output). No regstate/coverage here — WebKit results are a report, not the Chromium plan's input.
          rc=0; pass=0; fail=0
          for t in $T; do
            s=$(date +%s); timeout -s TERM 200 node tools/tests/$t.js flavius-arena.html >/tmp/wk_$t.log 2>&1; e=$?; d=$(( $(date +%s) - s ))
            if [ "$e" = 0 ] && ! grep -q 'ERRS \[[^]]' /tmp/wk_$t.log; then pass=$((pass+1)); echo "== $t == PASS ${d}s"; tail -3 /tmp/wk_$t.log
            else fail=$((fail+1)); rc=1; echo "== $t == FAIL exit=$e ${d}s"; tail -40 /tmp/wk_$t.log; fi
          done
          echo "WEBKIT SUMMARY pass $pass · fail $fail"
          exit $rc
