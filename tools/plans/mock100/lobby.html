<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Online Room v1.0</title>
<link rel="stylesheet" href="../mock98/mock98.css">
<script src="lobby_art.js"></script>
<style>
/* mock100 — the online pre-match ROOM for v1.0 (10a banner · 10e list · 10f/10g seats · 10i watchers). Static mock-up, not game code. */
body{overflow:auto}
.app{display:flex;min-height:100vh}
.orail{width:236px;flex:none;padding:14px 0 14px 22px;display:flex;flex-direction:column;gap:6px}
.orail h1{font:400 24px/1 var(--display);color:var(--gold2);margin:4px 0 10px;display:flex;gap:8px;align-items:center}
.orail a{display:block;padding:9px 12px;border-radius:7px;color:var(--bone);text-decoration:none;font-size:16px}
.orail a.on{background:linear-gradient(90deg,#3a2a18,#2a1f17);border:1px solid var(--gold);color:var(--gold2)}
.orail a.play{background:linear-gradient(#b8382a,#7d1f17);border:1px solid #e6c56a;text-align:center;font:400 18px var(--display);margin-bottom:6px}
.main{flex:1;min-width:0;padding:14px 22px 22px}
/* ---------- 10a banner ---------- */
.bn{display:flex;align-items:center;gap:16px;padding:12px 16px;border:1px solid var(--gold);border-radius:10px;
 background:linear-gradient(100deg,#3a2614 0%,#2a1d12 46%,#1d150e 100%);box-shadow:0 4px 18px #0008,inset 0 1px #f0cf7d22;position:relative;overflow:hidden}
.bn:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,#ffffff04 0 2px,transparent 2px 9px);pointer-events:none}
.bn .card{width:58px;height:80px;border-radius:5px;border:1px solid #c79a48;background:linear-gradient(#6a4a24,#3a2814);display:grid;place-items:center;font:400 26px var(--display);color:var(--gold2);flex:none;box-shadow:0 2px 6px #0009}
.bn .t1{font:400 27px/1.1 var(--display);color:var(--gold2);letter-spacing:.03em}
.bn .t1 small{font:400 19px var(--display);color:var(--bone)}
.bn .t2{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;border:1px solid var(--line2);background:#160f0b;font:500 12px var(--mono);color:var(--bone);white-space:nowrap}
.chip.rk{background:linear-gradient(#e7c568,#b98d34);color:#2a1a08;border-color:#f0cf7d;letter-spacing:.1em}
.chip.cu{background:#1f3448;border-color:#5a88b0;color:#dbe9f5;letter-spacing:.1em}
.chip.dim{color:var(--muted)}
.bn .sp{flex:1}
.code{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:6px 10px;border:1px dashed #8a6a3a;border-radius:8px;background:#140e09}
.code .l{font:500 10.5px var(--mono);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.code .v{white-space:nowrap;font:500 19px var(--mono);color:var(--gold2);letter-spacing:.08em;display:flex;align-items:center;gap:8px}
.code .cp{font:500 12px var(--body);padding:2px 8px;border-radius:5px;border:1px solid var(--line2);background:var(--panel2);color:var(--bone);cursor:pointer}
.code .ok{font:500 11px var(--mono);color:#8fd27a}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:8px;border:1px solid var(--line2);background:linear-gradient(#2e2219,#221811);color:var(--bone);font:500 15px var(--body);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--gold);color:var(--gold2)}
.btn .s{display:block;font:500 11px var(--mono);color:var(--muted)}
.btn.crier{flex-direction:row;text-align:left;line-height:1.2}
.btn.crier[disabled]{opacity:.55;cursor:default}
.btn.exit{border-color:#8a3a2e;background:linear-gradient(#4a1d17,#2e120e);color:#f3d1c8}
.btn.go{background:linear-gradient(#c79a3c,#8e6a22);border-color:#f0cf7d;color:#1d1206;font:400 19px var(--display);padding:11px 30px;box-shadow:0 0 0 1px #e6c56a,0 4px 14px #0008}
.btn.go[disabled]{filter:grayscale(.7);opacity:.55}
.btn.ready{background:linear-gradient(#3f7d3a,#2a5a27);border-color:#7fd070;color:#f2ffe8;font-size:17px;padding:10px 22px}
.btn.sm{padding:4px 9px;font-size:13px}
/* ---------- layout ---------- */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:16px;margin-top:14px;align-items:start}
.pane{border:1px solid var(--line2);border-radius:10px;background:var(--panel);padding:12px 14px}
.ph{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.ph h3{font:400 16px var(--display);color:var(--gold2);letter-spacing:.05em}
.ph .n{font:500 12px var(--mono);color:var(--muted)}
.ph .sp{flex:1}
/* ---------- 10f/10g seats ---------- */
.seats{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.seat{width:calc(25% - 9px);min-width:150px;max-width:220px;position:relative;border:1px solid #6a5036;border-radius:10px;background:linear-gradient(#2b2017,#1d150f);padding:10px 10px 10px;display:flex;flex-direction:column;align-items:center;min-height:286px}
.seat.me{border-color:var(--gold);box-shadow:0 0 0 1px #d6ab4c55,0 0 16px #d6ab4c22}
.seat.ta{border-top:4px solid #4b86c6}.seat.tb{border-top:4px solid #e08a35}
.seat .team{position:absolute;top:6px;left:8px;font:500 10.5px var(--mono);letter-spacing:.12em}
.seat.ta .team{color:#8dbbe8}.seat.tb .team{color:#f2b072}
.seat .num{position:absolute;top:6px;right:8px;font:500 11px var(--mono);color:var(--dim)}
.stage{position:relative;width:100%;height:150px;display:flex;align-items:flex-end;justify-content:center;margin-top:8px;
 background:radial-gradient(ellipse 60% 20% at 50% 92%,#00000080,transparent 70%),radial-gradient(ellipse 70% 70% at 50% 60%,#4a361f55,transparent 70%)}
.stage .por{position:absolute;left:0;top:0;width:58px;height:81px;border-radius:6px;overflow:hidden;border:1px solid #c79a48;box-shadow:0 2px 6px #000a;background:#140e09}
.stage .por svg{width:100%;height:100%;display:block}
.stage .tok{height:128px;display:flex;align-items:flex-end}
.stage .tok .tkfig{height:128px!important;width:76px!important}
.stage .crown{position:absolute;right:2px;top:0;font-size:20px;filter:drop-shadow(0 1px 2px #000)}
.bub{position:relative;margin:6px auto 0;min-height:26px;display:flex;justify-content:center}
.bub span{position:relative;display:inline-block;padding:3px 11px;border-radius:12px;background:#f2e6cc;color:#2a1a0c;font:600 13px var(--body);box-shadow:0 2px 5px #0009}
.bub span:before{content:"";position:absolute;left:50%;top:-6px;margin-left:-6px;border:6px solid transparent;border-top:0;border-bottom-color:#f2e6cc}
.bub.empty span{visibility:hidden}
.nm{font:400 18px/1.1 var(--display);color:var(--bone);text-align:center;margin-top:2px}
.seat.me .nm{color:var(--gold2)}
.cl{font-size:13px;color:var(--muted);text-align:center}
.rks{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.gr{display:inline-flex;align-items:center;gap:4px;padding:1px 8px 1px 4px;border-radius:999px;border:1px solid #8a6a3a;background:#1a120c;font:500 12px var(--mono);color:#f0d9a6}
.gr i{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f6dd94,#9a7524);display:inline-block;font-style:normal}
.dr{display:inline-flex;align-items:center;gap:4px;padding:1px 8px 1px 3px;border-radius:4px;border:1px solid var(--line2);background:#1a120c;font:500 12px var(--body);color:var(--bone)}
.dr img{height:20px;width:auto;display:block}
.rdy{position:absolute;top:30px;right:-6px;padding:2px 8px;border-radius:4px 0 0 4px;background:#3f7d3a;color:#eaffde;font:600 12px var(--body);box-shadow:0 1px 4px #0009}
.send{width:100%;display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:7px;border:1px solid #6a5036;background:#140e09;font-size:13px;color:var(--muted)}
.send b{color:var(--bone);font-weight:500}
.send select{background:#221811;color:var(--bone);border:1px solid var(--line2);border-radius:5px;padding:2px 4px;font:500 13px var(--mono)}
.coin{width:16px;height:16px;vertical-align:-3px}
.seat .foot{margin-top:auto;font-size:12.5px;color:var(--dim);text-align:center}
.seat.open{border:2px dashed #6a5036;background:#18110c80;justify-content:center;gap:8px}
.seat.open .ch{font-size:34px;opacity:.6}
.seat.open .o1{font:400 17px var(--display);color:var(--muted)}
.seat.open .o2{font-size:12.5px;color:var(--dim)}
/* table settings */
.set{margin-top:14px}
.sg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 12px}
.sg label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted)}
.sg .f{padding:7px 10px;border:1px solid var(--line2);border-radius:7px;background:#160f0b;color:var(--bone);font-size:14.5px;display:flex;justify-content:space-between}
.sg .f:after{content:"▾";color:var(--dim)}
.ro .sg .f{background:transparent;border-style:dashed}
.ro .sg .f:after{content:""}
.note{margin-top:8px;font-size:13px;color:var(--muted)}
.foot99{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line2)}
.foot99 .why{margin-right:auto;font-size:13.5px;color:var(--muted)}
/* 10i watchers */
.watch{margin:14px 0 0;display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid #3a5266;border-radius:9px;background:linear-gradient(90deg,#16222c,#14100c)}
.watch .h{font:400 15px var(--display);color:#cfe2f2;white-space:nowrap}
.watch .w{display:flex;align-items:center;gap:6px;padding:2px 9px 2px 3px;border-radius:999px;background:#0f171e;border:1px solid #2c4252;font-size:13px}
.watch .w .mp{width:22px;height:30px;border-radius:4px;overflow:hidden}
.watch .w .mp svg{width:100%;height:100%;display:block}
.watch .x2{margin-left:auto;font-size:12.5px;color:#9db6c9}
/* ---------- 10e list ---------- */
.list{display:flex;flex-direction:column;gap:4px}
.row{position:relative;display:grid;grid-template-columns:22px 34px minmax(0,1fr) auto 26px;align-items:center;gap:8px;height:52px;padding:0 10px;border:1px solid #3a2b1e;border-radius:8px;background:#1a130d}
.row.me{border-color:#8a6a3a;background:linear-gradient(90deg,#2e2216,#1a130d)}
.row .cr{font-size:16px;text-align:center}
.row .bnr img{height:34px;display:block;margin:auto}
.row .who{min-width:0}
.row .who b{display:block;font:500 15.5px var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .who small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .st{font:500 11.5px var(--mono);color:var(--muted);text-align:right}
.row .st.s{color:#e9d39c}
.row .ok{color:#8fd27a;font-size:17px;text-align:center}
.row .ok.no{color:#4a3a2a}
.row .acts{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:none;gap:6px;padding:4px;border-radius:8px;background:#221811;border:1px solid var(--gold);box-shadow:0 4px 12px #000a}
.row:hover .acts,.row.hov .acts{display:flex}
.row.hov{border-color:var(--gold)}
.row.empty{border:1px dashed #4a3826;background:transparent;grid-template-columns:22px 34px 1fr;color:var(--dim)}
.row.empty .slot{width:30px;height:30px;border:1px dashed #4a3826;border-radius:4px;margin:auto}
.row.empty .idx,.row .idx{font:500 11px var(--mono);color:var(--dim);text-align:center}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--dim)}
/* phrase picker */
.qc{margin-top:14px}
.qc .chips{display:flex;flex-wrap:wrap;gap:6px}
.qc .chips span{padding:4px 11px;border-radius:999px;border:1px solid #8a6a3a;background:#221811;font:600 13.5px var(--body);color:#f0d9a6;cursor:pointer}
.qc .chips span:hover{border-color:var(--gold2);color:var(--gold2)}
.horns{display:flex;align-items:center;gap:10px;padding:8px 14px;margin:0 0 10px;border:1px solid #a3281f;border-radius:9px;background:linear-gradient(90deg,#3a1410,#1d110c);font:400 17px var(--display);color:#f3d1c8}
.horns b{font:500 22px var(--mono);color:#ffd28a}
.anno{position:fixed;right:10px;bottom:8px;font:500 11px var(--mono);color:#6a5a48}
.stnav{position:fixed;left:10px;bottom:8px;display:flex;gap:6px;font:500 11px var(--mono)}
.stnav a{color:var(--muted);padding:2px 6px;border:1px solid var(--line2);border-radius:4px;text-decoration:none;background:#160f0b}
/* ---------- phone ---------- */
body.ph .orail{display:none}
body.ph .main{padding:10px 12px 90px}
body.ph .bn{flex-wrap:wrap;gap:10px;padding:10px}
body.ph .bn .card{width:40px;height:56px;font-size:18px}
body.ph .bn .t1{font-size:20px}body.ph .bn .t1 small{font-size:15px}
body.ph .bn .sp{display:none}
body.ph .bn .acts1{display:flex;gap:8px;width:100%}
body.ph .bn .acts1 .btn{flex:1;justify-content:center;padding:8px}
body.ph .code{width:100%;flex-direction:row;align-items:center;justify-content:space-between}
body.ph .grid{grid-template-columns:1fr}
body.ph .seats{gap:8px}
body.ph .seat{width:calc(50% - 4px);min-width:0;min-height:250px;padding:8px}
body.ph .stage{height:118px}
body.ph .stage .por{width:42px;height:59px}
body.ph .stage .tok .tkfig{height:104px!important;width:62px!important}
body.ph .nm{font-size:16px}
body.ph .sg{grid-template-columns:1fr 1fr}
body.ph .foot99{position:fixed;left:0;right:0;bottom:0;margin:0;padding:10px 12px;background:#140e09ee;border-top:1px solid var(--gold);z-index:5}
body.ph .foot99 .why{font-size:12px}
body.ph .row{height:46px}
body.ph .stnav,body.ph .anno{display:none}
</style></head>
<body>
<div class="app"><nav class="orail" id="rail"></nav><div class="main" id="main"></div></div>
<div class="stnav"><a href="#host">#host</a><a href="#guest">#guest</a><a href="#full">#full</a><a href="#phone">#phone</a></div>
<div class="anno">mock100 · online room v1.0 · static mock-up</div>
<script>
const A=window.ART;const coin='<img class="coin" src="../../../assets/coin.webp" alt="">';
const P={ /* seed → name, house, class, glory rank, domus rank, team */
 alpha:{n:'Alpha the Bold',h:'Domus Alpha',c:'Hero',g:'Gregarius',dr:'taberna'},
 marcus:{n:'Marcus of Capua',h:'Ludus Capuanus',c:'Soldier',g:'Gregarius',dr:'ludusminor'},
 thrax:{n:'Thrax the Patient',h:'Domus Thracia',c:'Veteranus',g:'Veteranus',dr:'ludus'},
 livia:{n:'Livia Ferox',h:'Familia Liviana',c:'Amazonia',g:'Novicius',dr:'tugurium'},
 cato:{n:'Cato Aurelius',h:'Domus Aurelia',c:'Royalty',g:'Primus Palus',dr:'ludusmagnus'},
 nerva:{n:'Nerva',h:'Casa Nervae',c:'Slave',g:'Tiro',dr:'tugurium'},
 brennus:{n:'Brennus Venator',h:'Domus Gallica',c:'Venatore',g:'Gregarius',dr:'taberna'},
 quintus:{n:'Quintus the Condemned',h:'Domus Damnata',c:'Damnatio',g:'Tiro',dr:'tugurium'}};
const DRN={tugurium:'Tugurium',taberna:'Taberna',ludusminor:'Ludus Minor',ludus:'Ludus',ludusmagnus:'Ludus Magnus',familianota:'Familia Nota',illustris:'Domus Illustris',aurea:'Domus Aurea'};
const drImg=k=>`<img src="${A.dr[k]}" alt="">`;
const drChip=k=>`<span class="dr" title="Domus rank · ${DRN[k]}">${drImg(k)}${DRN[k]}</span>`;
const grChip=g=>`<span class="gr" title="Glory rank"><i></i>${g}</span>`;

/* ---- states ---- */
const S0=location.hash.slice(1)||'host';
const phone=S0==='phone';if(phone)document.body.classList.add('ph');
const ST={
 host:{me:'alpha',hostK:'alpha',ev:'Classic · Democritus',city:'Roma',ranked:true,team:false,seats:4,
   seated:[['alpha',1,true,'Ave!'],['marcus',2,false,'Good luck'],['thrax',3,true,null]],standing:['livia'],hov:'marcus',crier:{left:2,cd:'1:24'},start:true},
 guest:{me:'marcus',hostK:'alpha',ev:'Classic · Democritus',city:'Roma',ranked:true,team:false,seats:4,
   seated:[['alpha',1,true,null],['marcus',2,false,'Ave!'],['thrax',3,true,null]],standing:['livia'],crier:{left:2,cd:'1:24'}},
 full:{me:'alpha',hostK:'alpha',ev:'Familia',city:'Capua',ranked:false,team:true,seats:6,horns:7,
   seated:[['alpha',1,true,'Vale',1],['marcus',2,true,null,2],['thrax',3,true,'Good luck',1],['cato',4,true,null,2],['brennus',5,true,'Ave!',1],['nerva',6,true,null,2]],
   standing:['livia','quintus'],crier:{left:0,cd:null}},
};ST.phone=Object.assign({},ST.host,{hov:null});
const s=ST[S0]||ST.host;const isHost=s.me===s.hostK;
const room=s.seated.length+s.standing.length;

/* ---- rail ---- */
document.getElementById('rail').innerHTML=`<h1>🌐 Online</h1><a class="play" href="#">⚔ Play</a><a class="on" href="#">📜 Lobby Browser</a><a href="#">👁 Spectate</a><a href="#">🛒 Armory &amp; Market</a><a href="#">🏛 Domus</a><a href="#">🔨 Auction</a><a href="#">💰 Wagers</a><a href="#">🪦 Hall of the Fallen</a><a href="#">👤 Profile &amp; Settings</a>`;

/* ---- 10a banner ---- */
const alone=room===1;
const crierBtn=isHost?(s.crier.left>0?`<button class="btn crier" ${s.crier.cd?'disabled title="The crier rests 2 min between calls"':''}>📣 <span>Call the crier<span class="s">${s.crier.left} of 3 left${s.crier.cd?' · next in '+s.crier.cd:''}</span></span></button>`:`<button class="btn crier" disabled>📣 <span>Crier spent<span class="s">0 of 3 left</span></span></button>`):'';
const exitBtn=isHost&&alone?`<button class="btn exit">🚪 Close lobby</button>`:`<button class="btn exit" title="${isHost?'The crown passes to '+P[s.seated.find(x=>x[0]!==s.me)?.[0]||'marcus'].n:''}">🚪 Exit lobby</button>`;
const banner=`<div class="bn"><div class="card">${s.team?'ⅠⅠ':'Ⅰ'}</div>
 <div><div class="t1">${s.ev} <small>at ${s.city}</small></div>
 <div class="t2">${s.ranked?'<span class="chip rk">⚔ RANKED</span>':'<span class="chip cu">CUSTOM</span>'}<span class="chip">☀ Day</span><span class="chip">${s.team?'Teams A · B':'Free for all'}</span><span class="chip dim">👥 ${room}/8 in the room</span><span class="chip dim">🪑 ${s.seated.length}/${s.seats} seated</span>${s.ranked?'<span class="chip">'+grChip('Gregarius')+' only</span>':''}</div></div>
 <div class="sp"></div>
 <div class="code" title="Friends type this in Lobby Browser → Join by code"><span class="l">Room code</span><span class="v">R-7KQ2M <span class="cp">⧉ Copy</span>${S0==='guest'?'<span class="ok">copied ✓</span>':''}</span></div>
 <div class="acts1" style="display:flex;gap:10px">${crierBtn}${exitBtn}</div></div>`;

/* ---- seats ---- */
function seatHTML(i){const t=s.seated.find(x=>x[1]===i);
 if(!t){const canSit=!s.seated.some(x=>x[0]===s.me);
  return `<div class="seat open"><span class="num">Seat ${i}</span><div class="ch">🪑</div><div class="o1">Open seat</div><div class="o2">${s.horns?'a CPU takes it':'a CPU if empty at the horns'}</div>${canSit?'<button class="btn sm">Sit here</button>':''}</div>`}
 const [k,,ready,say,team]=t;const p=P[k];const me=k===s.me;
 const tm=s.team?(team===1?'ta':'tb'):'';
 return `<div class="seat ${me?'me':''} ${tm}">${s.team?`<span class="team">TEAM ${team===1?'A':'B'}</span>`:''}<span class="num">Seat ${i}</span>${ready?'<span class="rdy">✓ Ready</span>':''}
  <div class="stage"><div class="por">${A.por[k]}</div><div class="tok">${A.tok[k]}</div></div>
  <div class="bub ${say?'':'empty'}"><span>${say||'·'}</span></div>
  <div class="nm">${k===s.hostK?'<span title="Host">👑</span> ':''}${p.n}</div><div class="cl">${p.c} · ${me?'you':p.h}</div>
  <div class="rks">${grChip(p.g)}${drChip(p.dr)}</div>
  ${me?`<div class="send" style="margin-top:10px">${coin}<b>Send</b><select><option>3</option></select><small style="margin-left:auto;font-size:12px;white-space:nowrap">of 41</small></div><div style="font-size:11px;color:var(--dim);margin-top:3px;text-align:center">coin from the treasury · back if he lives</div>`:''}
 </div>`}
let seatsH='';for(let i=1;i<=s.seats;i++)seatsH+=seatHTML(i);

/* ---- settings ---- */
const set=`<div class="set ${isHost&&!s.horns?'':'ro'}"><div class="ph"><h3>Table settings</h3><span class="n">${isHost&&!s.horns?'you are the host — changes reach everyone':'set by the host · '+P[s.hostK].n}</span></div>
 <div class="sg"><label>Event<span class="f">${s.ev}</span></label><label>City<span class="f">${s.city}</span></label><label>Seats<span class="f">${s.seats}</span></label><label>Time<span class="f">☀ Day</span></label>
 <label>Stands<span class="f">act in round 1</span></label><label>Ticket<span class="f">${s.ranked?'none':'5 coin'}</span></label><label>${s.team?'Teams':'If someone leaves'}<span class="f">${s.team?'Auto-balance':'a CPU takes over'}</span></label>${s.ranked?'':'<label>Password<span class="f">🔒 set</span></label>'}</div></div>`;

/* ---- watchers (10i) ---- */
const watch=s.horns?`<div class="watch"><span class="h">👁 Watching</span>${s.standing.map(k=>`<span class="w"><span class="mp">${A.por[k]}</span>${P[k].n}</span>`).join('')}<span class="x2">not seated at the horns → they watch · not counted as players</span></div>`:
 (s.standing.length?`<div class="watch" style="border-style:dashed;opacity:.85"><span class="h">🧍 Standing</span>${s.standing.map(k=>`<span class="w"><span class="mp">${A.por[k]}</span>${P[k].n}</span>`).join('')}<span class="x2">no seat at the horns = 👁 watch (not a player)</span></div>`:'');

/* ---- foot (Start / Ready) ---- */
const myT=s.seated.find(x=>x[0]===s.me);
const foot=s.horns?`<div class="horns">📯 The horns sound in <b>0:0${s.horns}</b><span style="flex:1"></span>${isHost?'<button class="btn exit">✕ Hold</button>':''}</div>`:
 `<div class="foot99"><span class="why">${isHost?'⌛ '+s.seated.filter(x=>!x[2]).map(x=>P[x[0]].n).join(', ')+' not ready — Start anyway, empty seats go to CPUs':'Waiting for the host to start'}</span>${myT&&!myT[2]?'<button class="btn ready">✓ Ready</button>':''}${isHost?'<button class="btn go">▶ Start</button>':''}</div>`;

/* ---- 10e list ---- */
const members=[...s.seated.map(x=>({k:x[0],seat:x[1],ready:x[2],team:x[4]})),...s.standing.map(k=>({k,seat:0}))];
members.sort((a,b)=>(a.k===s.hostK?-1:b.k===s.hostK?1:0));
let rows='';for(let i=0;i<8;i++){const m=members[i];
 if(!m){rows+=`<div class="row empty"><span class="idx">${i+1}</span><span class="slot"></span><span>open</span></div>`;continue}
 const p=P[m.k];const me=m.k===s.me;const hov=s.hov===m.k&&isHost;
 const stt=m.seat?`<span class="st s">Seat ${m.seat}${s.team?' · '+(m.team===1?'A':'B'):''}</span>`:`<span class="st">${s.horns?'👁 watching':'standing'}</span>`;
 rows+=`<div class="row ${me?'me':''} ${hov?'hov':''}"><span class="cr">${m.k===s.hostK?'👑':'<span class="idx">'+(i+1)+'</span>'}</span><span class="bnr" title="${DRN[p.dr]}">${drImg(p.dr)}</span>
  <span class="who"><b>${p.n}${me?' <span style="color:var(--gold2);font-size:12px">· you</span>':''}</b><small>${p.h} · ${p.g} · ${DRN[p.dr]}</small></span>${stt}<span class="ok ${m.ready?'':'no'}">${m.seat?(m.ready?'✓':'○'):''}</span>
  ${isHost&&!me?`<span class="acts"><button class="btn sm">👑 Give host</button><button class="btn sm exit">✕ Kick</button></span>`:''}</div>`}
const list=`<div class="pane"><div class="ph"><h3>In the room</h3><span class="n">${room}/8</span><span class="sp"></span><span class="n">✓ ready · ○ not yet</span></div><div class="list">${rows}</div>
 ${isHost?'<div class="legend">Hover a lanista: 👑 Give host · ✕ Kick (5 min). Click a name: house card.</div>':'<div class="legend">Click a name: house card (record, gladiators, ★ Follow).</div>'}
 <div class="qc"><div class="ph"><h3>Quick chat</h3><span class="n">pops under your token · 6 s</span></div><div class="chips">${['Ave!','2 min','Sound the horns?','Swap teams?','One more seat?','Good luck','Vale'].map(x=>`<span>${x}</span>`).join('')}</div></div></div>`;

document.getElementById('main').innerHTML=banner+`<div class="grid"><div><div class="pane">${s.horns?foot+watch:''}<div class="seats" style="${s.horns?'margin-top:12px':''}">${seatsH}</div>${s.horns?'':watch}${set}${s.horns?'':foot}</div></div><div>${list}</div></div>`;
if(phone){/* phone: list after seats, settings folded */}
</script>
</body></html>
