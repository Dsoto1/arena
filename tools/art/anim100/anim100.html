<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Anim sheets</title></head>
<body style="background:#2a2520;color:#eee;font:13px sans-serif">
<p>v1.0 animated gladiator sheets — renders driven by make.js (the game's own plain scripts: three93.js, gear100.js, body100.js, tok93.js)</p>
<script src="../../../assets/three93.js"></script>
<script src="../../../assets/gear100.js"></script>
<script src="../../../assets/body100.js"></script>
<script src="../../../assets/tok93.js"></script>
<script>
window.addEventListener('error', e => { window.__err = String(e.message); });
/* the pose list + renderer = the ANIM100_LIB block of src/board/311-v100anim.js (the game renders Studio / online tokens with the same code) */
(async () => {
  try {
    const src = await (await fetch('../../../src/board/311-v100anim.js')).text();
    const a = src.indexOf('/* ANIM100_LIB:BEGIN'), b = src.indexOf('/* ANIM100_LIB:END */');
    if (a < 0 || b < 0) throw new Error('ANIM100_LIB markers missing in src/board/311-v100anim.js');
    window.AN100L = new Function(src.slice(a, b) + ';return AN100L')();
    window.AN100R = {
      api: null,
      async init() { if (!this.api) this.api = await window.TOK93LIB(window.THREE93).createToken({}); return { baked: !!this.api.baked, bodyBaked: !!this.api.bodyBaked }; },
      /* one class + set → {url (WebP), meta, w, h, ms} */
      async sheet(look, gear, set, pxmm, q, limb) { const api = this.api; const t0 = performance.now(); api.apply({ look, gear, pose: api.presets[0][2] });
        const r = await AN100L.render(api, set, { pxmm, ss: 2, limb }); const url = r.canvas.toDataURL('image/webp', q);
        return { url, png: set === 'move' || limb ? r.canvas.toDataURL('image/png') : '', meta: r.meta, w: r.canvas.width, h: r.canvas.height, ms: Math.round(performance.now() - t0) }; },
      /* v1.06a LIGHT (make.js l106): the sheet lit by ONE sun (cfg = 399's LIGHT106_BAKE) + its ground-shadow sheet at shPx px/mm — both by the
         ANIM100_LIB renderer the game uses on the device (AN100L.light / shadowRow) → {url, png, meta, shPng, shMeta, w, h, ms} */
      async sheetL(look, gear, set, pxmm, q, limb, cfg, shPx) { const api = this.api; const t0 = performance.now(); api.apply({ look, gear, pose: api.presets[0][2] });
        const r = await AN100L.render(api, set, { pxmm, ss: 2, limb, light: cfg, shadow: { pxmm: shPx, ss: 2 } });
        return { url: r.canvas.toDataURL('image/webp', q), png: r.canvas.toDataURL('image/png'), meta: r.meta, shPng: r.sh.canvas.toDataURL('image/png'), shMeta: r.sh.meta,
          w: r.canvas.width, h: r.canvas.height, shW: r.sh.canvas.width, shH: r.sh.canvas.height, ms: Math.round(performance.now() - t0) }; },
    };
    window.AN100R_READY = true;
  } catch (e) { window.__err = String(e && e.stack || e); }
})();
</script>
</body></html>
