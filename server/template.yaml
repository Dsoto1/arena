AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Flavius Rule — the Online Arena. A WebSocket API (API Gateway) with one Lambda, one DynamoDB table,
  Cognito sign-in with Google, and a monthly budget that closes the arena (until the 1st) when it is reached. Deploy from CloudShell with server/deploy.sh.

Parameters:
  SiteUrl:
    Type: String
    Default: https://flaviusrule.com
    Description: Where the game is served (no trailing slash). Sign-in returns to SiteUrl/play/.
  AuthDomainPrefix:
    Type: String
    Default: flaviusrule-arena
    AllowedPattern: '^[a-z0-9-]{3,60}$'
    Description: Prefix for the Cognito sign-in page (https://<prefix>.auth.<region>.amazoncognito.com). Must be unused in this region.
  CustomAuthDomain:
    Type: String
    Default: none
    Description: 'Optional own sign-in address, e.g. login.flaviusrule.com (needs HostedZoneId). Google then names your site, not amazoncognito.com.'
  CustomAuthStage:
    Type: String
    AllowedValues: [cert, live]
    Default: cert
    Description: 'cert = make and validate the certificate only. live = a LATER deploy (15+ minutes after cert) adds the sign-in domain and its DNS record. CloudFront cannot see a certificate issued seconds earlier, so one deploy that does both fails.'
  HostedZoneId:
    Type: String
    Default: none
    Description: The Route 53 hosted zone of the site's domain (for the certificate and the sign-in record).
  GoogleClientId:
    Type: String
    Description: OAuth client ID from Google Cloud Console (APIs & Services > Credentials). Leave "none" to deploy without Google first.
    Default: none
  GoogleClientSecret:
    Type: String
    NoEcho: true
    Default: none
    Description: The matching client secret (stored by Cognito, never shown).
  AlertEmail:
    Type: String
    Description: Where the budget alarm and nothing else is sent.
  MonthlyBudgetUSD:
    Type: Number
    Default: 10
    Description: E-mail when the forecast passes this; when real spend reaches it, the arena closes itself until the 1st.
  DevNames:
    Type: String
    AllowedValues: ['false', 'true']
    Default: 'false'
    Description: 'true only on a test stack: allows signing in with a typed name instead of Google.'

Conditions:
  HasGoogle: !Not [!Equals [!Ref GoogleClientId, none]]
  HasCustomAuth: !And [!Not [!Equals [!Ref CustomAuthDomain, none]], !Not [!Equals [!Ref HostedZoneId, none]]]
  CustomAuthLive: !And [!Condition HasCustomAuth, !Equals [!Ref CustomAuthStage, live]]

Resources:
  # ---------- data ----------
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: PK, AttributeType: S}
        - {AttributeName: SK, AttributeType: S}
        - {AttributeName: GSI1PK, AttributeType: S}
        - {AttributeName: GSI1SK, AttributeType: N}
      KeySchema:
        - {AttributeName: PK, KeyType: HASH}
        - {AttributeName: SK, KeyType: RANGE}
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - {AttributeName: GSI1PK, KeyType: HASH}
            - {AttributeName: GSI1SK, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
      TimeToLiveSpecification: {AttributeName: ttl, Enabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}

  # ---------- sign-in ----------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: flavius-arena-players
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Schema:
        - {Name: email, Required: true, Mutable: true, AttributeDataType: String}
        - {Name: name, Required: false, Mutable: true, AttributeDataType: String}
  GoogleIdP:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: HasGoogle
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: openid email profile
      AttributeMapping: {email: email, name: name}
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref AuthDomainPrefix
      UserPoolId: !Ref UserPool
  # the own sign-in address: a free certificate (validated through Route 53), Cognito's custom domain, and the DNS alias
  AuthCert:
    Type: AWS::CertificateManager::Certificate
    Condition: HasCustomAuth
    Properties:
      DomainName: !Ref CustomAuthDomain
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref CustomAuthDomain
          HostedZoneId: !Ref HostedZoneId
  CustomAuthPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Condition: CustomAuthLive
    Properties:
      Domain: !Ref CustomAuthDomain
      UserPoolId: !Ref UserPool
      CustomDomainConfig:
        CertificateArn: !Ref AuthCert
  AuthAlias:
    Type: AWS::Route53::RecordSet
    Condition: CustomAuthLive
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref CustomAuthDomain
      Type: A
      AliasTarget:
        DNSName: !GetAtt CustomAuthPoolDomain.CloudFrontDistribution
        HostedZoneId: Z2FDTNDATAQYW2
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: flavius-arena-web
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      CallbackURLs: [!Sub '${SiteUrl}/play/', !Sub '${SiteUrl}/play/index.html', 'http://localhost:8137/flavius-arena.html']
      LogoutURLs: [!Sub '${SiteUrl}/play/', !Sub '${SiteUrl}/play/index.html', 'http://localhost:8137/flavius-arena.html']
      SupportedIdentityProviders: !If [HasGoogle, [!Ref GoogleIdP], [COGNITO]]   # the Ref makes the client wait for the provider
      IdTokenValidity: 12
      AccessTokenValidity: 12
      RefreshTokenValidity: 30
      TokenValidityUnits: {IdToken: hours, AccessToken: hours, RefreshToken: days}

  # ---------- the server ----------
  FnRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - {Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]
      Policies:
        - PolicyName: arena
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem, dynamodb:UpdateItem, dynamodb:Query]
                Resource: [!GetAtt Table.Arn, !Sub '${Table.Arn}/index/*']
              - Effect: Allow
                Action: execute-api:ManageConnections
                Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WsApi}/*'
  Fn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: flavius-arena
      Runtime: nodejs24.x
      Architectures: [arm64]
      Handler: index.handler
      Code: ./src
      Role: !GetAtt FnRole.Arn
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          TABLE: !Ref Table
          POOL_ID: !Ref UserPool
          CLIENT_ID: !Ref UserPoolClient
          DEV_NAMES: !Ref DevNames
  FnLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/flavius-arena
      RetentionInDays: 7

  WsApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: flavius-arena
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: '$request.body.t'
  WsIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WsApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${Fn.Arn}/invocations'
  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref WsApi, RouteKey: $connect, AuthorizationType: NONE, Target: !Sub 'integrations/${WsIntegration}'}
  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref WsApi, RouteKey: $disconnect, Target: !Sub 'integrations/${WsIntegration}'}
  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref WsApi, RouteKey: $default, Target: !Sub 'integrations/${WsIntegration}'}
  WsStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WsApi
      StageName: live
      AutoDeploy: true
      DefaultRouteSettings: {ThrottlingBurstLimit: 200, ThrottlingRateLimit: 100}
  WsInvoke:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Fn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WsApi}/*'

  # ---------- the money alarm ----------
  Budget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: flavius-arena-budget   # renamed: a new budget replaces the first one (whose saved e-mail could not be updated)
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: !Ref MonthlyBudgetUSD, Unit: USD}
      NotificationsWithSubscribers:
        - Notification: {NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref AlertEmail}]
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref AlertEmail}]
        # the kill switch: real spend reaches the budget → the arena closes until the 1st of next month
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE}
          Subscribers:
            - {SubscriptionType: EMAIL, Address: !Ref AlertEmail}
            - {SubscriptionType: SNS, Address: !Ref BudgetTopic}

  # ---------- the kill switch ----------
  BudgetTopic:
    Type: AWS::SNS::Topic
    Properties: {TopicName: flavius-arena-budget}
  BudgetTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref BudgetTopic]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: budgets.amazonaws.com}
            Action: sns:Publish
            Resource: !Ref BudgetTopic
  SwitchRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - {Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]
      Policies:
        - PolicyName: switch
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [lambda:PutFunctionConcurrency, lambda:DeleteFunctionConcurrency]
                Resource: !GetAtt Fn.Arn
  Switch:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: flavius-arena-switch
      Runtime: nodejs24.x
      Architectures: [arm64]
      Handler: index.handler
      Role: !GetAtt SwitchRole.Arn
      MemorySize: 128
      Timeout: 10
      Environment: {Variables: {ARENA: !Ref Fn}}
      Code:
        ZipFile: |
          // Closes the arena (concurrency 0: it cannot run, nothing is billed, nothing is deleted) when the budget
          // topic fires; reopens it when called with {"reopen":true} (the monthly rule, or by hand).
          const {LambdaClient,PutFunctionConcurrencyCommand,DeleteFunctionConcurrencyCommand}=require('@aws-sdk/client-lambda');
          const L=new LambdaClient({});
          exports.handler=async ev=>{const fn=process.env.ARENA;
            if(ev&&ev.reopen){await L.send(new DeleteFunctionConcurrencyCommand({FunctionName:fn}));console.log('arena reopened');return 'open'}
            await L.send(new PutFunctionConcurrencyCommand({FunctionName:fn,ReservedConcurrentExecutions:0}));console.log('arena closed: budget reached');return 'closed'};
  SwitchSub:
    Type: AWS::SNS::Subscription
    Properties: {TopicArn: !Ref BudgetTopic, Protocol: lambda, Endpoint: !GetAtt Switch.Arn}
  SwitchFromSns:
    Type: AWS::Lambda::Permission
    Properties: {Action: lambda:InvokeFunction, FunctionName: !Ref Switch, Principal: sns.amazonaws.com, SourceArn: !Ref BudgetTopic}
  ReopenMonthly:
    Type: AWS::Events::Rule
    Properties:
      Description: Reopen the online arena on the 1st of each month (budgets reset).
      ScheduleExpression: cron(5 0 1 * ? *)
      Targets: [{Arn: !GetAtt Switch.Arn, Id: reopen, Input: '{"reopen":true}'}]
  SwitchFromEvents:
    Type: AWS::Lambda::Permission
    Properties: {Action: lambda:InvokeFunction, FunctionName: !Ref Switch, Principal: events.amazonaws.com, SourceArn: !GetAtt ReopenMonthly.Arn}

Outputs:
  ReopenCommand:
    Description: Reopen the arena by hand after it closed for the month.
    Value: !Sub 'aws lambda invoke --function-name ${Switch} --cli-binary-format raw-in-base64-out --payload ''{"reopen":true}'' /dev/stdout'
  WebSocketUrl:
    Description: Paste into the game (Settings > Online server) — or put in play/online.json.
    Value: !Sub 'wss://${WsApi}.execute-api.${AWS::Region}.amazonaws.com/live'
  SignInDomain:
    Description: The "auth" value for play/online.json.
    Value: !If [CustomAuthLive, !Sub 'https://${CustomAuthDomain}', !Sub 'https://${AuthDomainPrefix}.auth.${AWS::Region}.amazoncognito.com']
  UserPoolClientId:
    Value: !Ref UserPoolClient
  UserPoolId:
    Value: !Ref UserPool
  GoogleRedirectUri:
    Description: Add this as an "Authorized redirect URI" on the Google OAuth client.
    Value: !If [CustomAuthLive, !Sub 'https://${CustomAuthDomain}/oauth2/idpresponse', !Sub 'https://${AuthDomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/idpresponse']
